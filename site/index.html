<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kazakh Dictionary</title>
  <!-- Everything loads from this site only, and scripts can't inject HTML (Trusted Types). -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; require-trusted-types-for 'script'; trusted-types 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- scripts/stamp.mjs sets the deploy's version; js/data.js reloads the page if it differs from the scripts. -->
  <meta name="build" content="dev">
  <script src="js/theme-init.js"></script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/dictionary.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container wide">
      <a class="brand" href="./">Қазақ<span>ша</span></a>
      <nav class="nav">
        <a href="./" aria-current="page">Dictionary</a>
        <a href="quiz.html">Quiz</a>
        <a href="rules.html">Rules</a>
      </nav>
      <button id="theme-toggle" class="secondary small theme-toggle" type="button">◐ <span class="theme-label">Auto</span></button>
    </div>
  </header>

  <main class="container wide">
    <div class="search">
      <input id="search" type="search" placeholder="Search Kazakh or Russian"
             autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Search words">
      <details id="category-filter" class="category-filter"></details>
      <div class="toolbar">
        <p id="summary" class="muted small" aria-live="polite"></p>
        <button id="expand-all" class="ghost small" type="button" hidden>Expand all</button>
        <button id="collapse-all" class="ghost small" type="button" hidden>Collapse all</button>
      </div>
    </div>
    <div id="results"></div>
  </main>

  <footer class="site-footer">
    Pronunciation is synthetic: generated with <a href="https://github.com/OHF-Voice/piper1-gpl">Piper</a> using a voice
    trained on <a href="https://github.com/IS2AI/Kazakh_TTS">ISSAI KazakhTTS</a> (CC BY 4.0).
  </footer>
</body>
</html>
