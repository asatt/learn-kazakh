<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kazakh Dictionary</title>
  <script>try{var t=JSON.parse(localStorage.getItem("lk.theme"));if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/dictionary.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="./">Қазақ<span>ша</span></a>
      <nav class="nav">
        <a href="./" aria-current="page">Dictionary</a>
        <a href="quiz.html">Quiz</a>
      </nav>
      <button id="theme-toggle" class="secondary small theme-toggle" type="button">◐ Auto</button>
    </div>
  </header>

  <main class="container">
    <div class="search">
      <input id="search" type="search" placeholder="Search Kazakh or Russian"
             autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Search words">
      <div id="chips" class="chips" role="group" aria-label="Filter by category"></div>
      <p id="summary" class="muted small" aria-live="polite"></p>
    </div>
    <div id="results"></div>
  </main>

  <footer class="site-footer">
    Pronunciation is synthetic: generated with <a href="https://github.com/OHF-Voice/piper1-gpl">Piper</a> using a voice
    trained on <a href="https://github.com/IS2AI/Kazakh_TTS">ISSAI KazakhTTS</a> (CC BY 4.0).
  </footer>
</body>
</html>
