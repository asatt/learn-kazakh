name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Actions are pinned to commit SHAs so a moved tag can't change what runs; Dependabot proposes updates.
# Only the deploy job gets write access to Pages.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Build words.json
        run: node scripts/build.mjs

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      # Every package, including transitive dependencies, must match a hash in the lock file.
      - run: "pip install --require-hashes --only-binary=:all: -r scripts/requirements.txt"
      # Each run restores the newest cache, generates audio only for new or changed words, and saves a new cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/voices
            site/audio
          key: tts-${{ hashFiles('tts.json', 'words/**') }}
          restore-keys: tts-
      - name: Generate pronunciation audio
        run: python scripts/tts.py

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
